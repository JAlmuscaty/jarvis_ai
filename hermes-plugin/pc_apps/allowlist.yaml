# Allowlisted apps Jarvis may open on the PC (visible Chrome after /browser connect).
# Add more entries later; restart Hermes gateway to pick up changes.
#
# kind:
#   focus  — bring Chrome to the front (no new URL)
#   url    — open/focus a tab at the given https URL in the connected Chrome

apps:
